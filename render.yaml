services:
  - type: web
    name: debtguard-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: debtguard-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: REMINDER_CRON
        value: "0 9 * * *"

databases:
  - name: debtguard-db
    plan: free
